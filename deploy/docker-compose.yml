# docker compose -f deploy/docker-compose.yml up -d --build
services:
  catalogo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BASE_PATH: /
        SITE_URL: https://catalogo.awucloud.com.br
    image: catalogo-luretec
    container_name: catalogo-luretec
    restart: unless-stopped
    ports:
      - "8080:80"
