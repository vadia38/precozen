# nginx para o site estático (usado pelo Dockerfile; serve também de referência para Proxmox/VM).
#
# Atenção ao comportamento do nginx: um add_header dentro de "location" descarta os add_header do
# nível "server". Por isso o Cache-Control e o CORS vêm de "map" e todos os cabeçalhos ficam
# declarados uma única vez no server, valendo para todos os caminhos.

map $uri $cache_control {
    default                        "public, max-age=300";
    ~^/sw\.js$                     "no-cache";
    ~^/manifest\.webmanifest$      "public, max-age=86400";
    ~^/img/                        "public, max-age=2592000";
    ~^/css/                        "public, max-age=604800";
    ~^/js/                         "public, max-age=604800";
    ~^/downloads/                  "public, max-age=86400";
    ~^/api/                        "public, max-age=3600";
}

map $uri $cors_origin {
    default  "";
    ~^/api/  "*";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança — mesma política de public/_headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Cache-Control $cache_control always;
    add_header Access-Control-Allow-Origin $cors_origin always;
    # Ative o HSTS somente atrás de TLS válido:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/html text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/csv application/xml;
    gzip_min_length 1024;

    types { application/manifest+json webmanifest; }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
