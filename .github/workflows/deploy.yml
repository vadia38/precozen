name: Testar e publicar

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testar:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar dados
        run: npm run validar
      - name: Testes (catálogo e Precozen Central)
        run: npm test
      - name: Fluxo de exemplo do Precozen Central
        run: node central/bin/precozen.js exemplo --rapido --silencioso
      - name: Build (GitHub Pages)
        env:
          # Para domínio próprio, defina as variáveis do repositório SITE_URL e BASE_PATH
          # (Settings → Secrets and variables → Actions → Variables) e crie public/CNAME.
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
        run: node src/build.js
      - name: Guardar artefato do site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    name: GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: testar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
